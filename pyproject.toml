[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fusebench"
version = "0.1.0"
description = "Controlled benchmark comparing Terra-only and Terra plus Jev decision architectures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "matplotlib>=3.10",
  "numpy>=2.3",
  "pandas>=2.3",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "scipy>=1.16",
  "typer>=0.16",
  "typesafe-sdk>=0.1",
]

[project.scripts]
fusebench = "fusebench.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fusebench"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
  "live: requires external provider credentials or authenticated local service",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
